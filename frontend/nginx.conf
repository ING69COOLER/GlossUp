server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: cualquier ruta desconocida devuelve index.html (react-router se encarga)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Opcional: en producción se puede redirigir /api al backend real.
    # location /api/ {
    #     proxy_pass http://backend:8080/api/;
    # }
}
