spring:
  application:
    name: glossup-backend

  datasource:
    url: ${GLOSSUP_DB_URL:jdbc:postgresql://localhost:5432/glossup}
    username: ${GLOSSUP_DB_USER:glossup}
    password: ${GLOSSUP_DB_PASSWORD:glossup}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # El esquema lo gobierna Flyway; Hibernate solo valida que las entidades coincidan.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${GLOSSUP_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

glossup:
  security:
    jwt:
      # IMPORTANTE: en produccion sobrescribir con la variable GLOSSUP_JWT_SECRET (>= 32 bytes).
      secret: ${GLOSSUP_JWT_SECRET:cambia-este-secreto-de-desarrollo-min-32-bytes!!}
      expiration-ms: ${GLOSSUP_JWT_EXPIRATION_MS:3600000}
  cors:
    allowed-origins: ${GLOSSUP_CORS_ORIGINS:http://localhost:5173,http://localhost:4200,http://localhost:3000}
